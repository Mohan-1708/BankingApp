<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/_layout}"
      th:with="page='login'">
<head>
    <title>Register</title>
</head>
<body>

<!--
  This content is injected into the "split-page-right" div
  in _layout.html. All positioning classes have been removed
  as the layout file handles them.
-->
<div layout:fragment="content">
    <div class="card shadow-lg border-0 rounded-lg">
        <div class="card-body p-4 p-md-5">

            <h2 class="text-center fw-bold text-dark mb-4">Create an Account</h2>

            <!-- Error Message -->
            <div th:if="${error}" class="alert alert-danger" role="alert"
                 th:text="${error}">
            </div>

            <form th:action="@{/register}" method="post">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="name" name="name"
                           placeholder="Your Name" required>
                    <label for="name">Full Name</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="email" name="email"
                           placeholder="name@example.com" required>
                    <label for="email">Email address</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="Password" required>
                    <label for="password">Password</label>
                </div>
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                        <i class="bi bi-person-plus-fill"></i> Register
                    </button>
                </div>
            </form>
        </div>
        <div class="card-footer text-center py-3 bg-light">
            <div class="small"><a th:href="@{/login}">Have an account? Go to login</a></div>
        </div>
    </div>
</div>

</body>
</html>
