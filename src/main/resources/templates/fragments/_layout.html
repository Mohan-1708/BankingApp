<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spring Bank</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        crossorigin="anonymous">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="d-flex flex-column min-vh-100 app-bg">

<!-- Navbar -->
<div th:replace="~{fragments/_navbar :: navbar}"></div>

<!-- MAIN CONTENT AREA -->
<div class="container-fluid mt-4 flex-grow-1">

  <!-- ✅ Conditional Split Layout -->
  <div th:if="${page == 'login' or page == 'register'}" class="row align-items-center min-vh-75">
    <!-- Banner (Left Side) -->
    <div class="col-md-6 d-none d-md-flex justify-content-center align-items-center p-0">
      <div class="banner-section w-100 h-100">
        <div>
          <img th:src="@{/images/bank_banner.png}" alt="Java Dev Bank">
          <h2>Java Dev Bank</h2>
          <p>“Empowering Innovation, Engineering the Future.”</p>
        </div>
      </div>
    </div>

    <!-- Right Side (Injected Page Content) -->
    <div class="col-md-6 d-flex justify-content-center">
      <div class="w-75 my-5" layout:fragment="content"></div>
    </div>
  </div>

  <!-- ✅ Normal Layout (for Dashboard, Transfer, etc.) -->
  <div th:unless="${page == 'login' or page == 'register'}">
    <div layout:fragment="content"></div>
  </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/_footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
</body>
</html>
