<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/_layout_standard}"> <!-- <-- This is correct -->
<head>
    <title>Admin Dashboard</title>
</head>
<body>
<div layout:fragment="content">
    <h1 class="display-5 mb-4 text-dark">Admin Dashboard</h1>

    <!-- Alerts for success/error messages -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill"></i> <strong th:text="${success}"></strong>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i> <strong th:text="${error}"></strong>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${info}" class="alert alert-info alert-dismissible fade show" role="alert">
        <i class="bi bi-info-circle-fill"></i> <strong th:text="${info}"></strong>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Stats Cards -->
    <div class="row mb-4">
        <div class="col-md-4 mb-4">
            <div class="card shadow border-0 h-100">
                <div class="card-body d-flex align-items-center">
                    <div class="display-4 text-primary me-3"><i class="bi bi-people-fill"></i></div>
                    <div>
                        <div class="text-muted text-uppercase">Total Customers</div>
                        <div class="h2 fw-bold mb-0" th:text="${totalCustomers}">0</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-4">
            <div class="card shadow border-0 h-100">
                <div class="card-body d-flex align-items-center">
                    <div class="display-4 text-success me-3"><i class="bi bi-journal-text"></i></div>
                    <div>
                        <div class="text-muted text-uppercase">Total Accounts</div>
                        <div class="h2 fw-bold mb-0" th:text="${totalAccounts}">0</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-4">
            <div class="card shadow border-0 h-100">
                <div class="card-body d-flex align-items-center">
                    <div class="display-4 text-info me-3"><i class="bi bi-wallet-fill"></i></div>
                    <div>
                        <div class="text-muted text-uppercase">Total Bank Balance</div>
                        <div class="h2 fw-bold mb-0">₹<span th:text="${#numbers.formatDecimal(totalBalance, 1, 'COMMA', 2, 'POINT')}">0.00</span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Forms (Search & Deposit) -->
    <div class="row">
        <div class="col-lg-6 mb-4">
            <div class="card shadow-lg border-0 rounded-lg h-100">
                <div class="card-body p-4 p-md-5">
                    <h2 class="text-center fw-bold text-dark mb-4">Search Accounts</h2>
                    <!-- This form searches by GET request to the current page -->
                    <form th:action="@{/admin/dashboard}" method="GET">
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="query" name="query"
                                   placeholder="Account Number or Email" th:value="${param.query}">
                            <label for="query">Account Number or Email</label>
                        </div>
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                                <i class="bi bi-search"></i> Search
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-lg-6 mb-4">
            <div class="card shadow-lg border-0 rounded-lg h-100">
                <div class="card-body p-4 p-md-5">
                    <h2 class="text-center fw-bold text-dark mb-4">Make a Deposit</h2>
                    <!-- This form POSTs to the /admin/deposit endpoint -->
                    <form th:action="@{/admin/deposit}" th:object="${depositDto}" method="POST">
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="toAccountNumber"
                                   th:field="*{toAccountNumber}" placeholder="Recipient's Account Number" required>
                            <label for="toAccountNumber">To Account Number</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="number" class="form-control" id="amount" th:field="*{amount}"
                                   placeholder="0.00" min="0.01" step="0.01" required>
                            <label for="amount">Amount (₹)</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="description"
                                   th:field="*{description}" placeholder="e.g., Bonus, Correction">
                            <label for="description">Description (Optional)</label>
                        </div>
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-success w-100 py-2 fw-bold">
                                <i class="bi bi-cash-stack"></i> Submit Deposit
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- All Accounts / Search Results Section -->
    <div class="mt-4">
        <!-- The title changes based on whether a search was performed -->
        <h2 class="text-dark" th:text="${param.query != null ? 'Search Results' : 'All Customer Accounts'}">All Customer Accounts</h2>
        <div class="card shadow-lg border-0 rounded-lg">
            <div class="card-body p-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                        <tr>
                            <th scope="col">Owner Name</th>
                            <th scope="col">Owner Email</th>
                            <th scope="col">Account Number</th>
                            <th scope="col">Account Type</th>
                            <th scope="col" class="text-end">Balance (₹)</th>
                        </tr>
                        </thead>
                        <tbody>
                        <!-- Show message if no accounts are found -->
                        <tr th:if="${accounts.isEmpty()}">
                            <td colspan="5" class="text-center text-muted p-4">No accounts found.</td>
                        </tr>
                        <!-- Loop over accounts -->
                        <tr th:each="account : ${accounts}">
                            <td th:text="${account.user.name}">John Doe</td>
                            <td th:text="${account.user.email}">john@example.com</td>
                            <td th:text="${account.accountNumber}">1234567890</td>
                            <td th:text="${account.accountType}">SAVINGS</td>
                            <td class="text-end fw-bold" th:text="${#numbers.formatDecimal(account.balance, 1, 'COMMA', 2, 'POINT')}">5,000.00</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
