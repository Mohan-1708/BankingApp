<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/_layout}">
<head>
    <title>Transaction History</title>
</head>
<body>

<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="display-6">Transaction History</h1>
            <p class="lead text-muted" th:text="'Account: ' + ${account.accountNumber}">Account: 1234567890</p>
        </div>
        <a th:href="@{/dashboard}" class="btn btn-outline-primary">
            <i class="bi bi-arrow-left"></i> Back to Dashboard
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th scope="col">Date</th>
                        <th scope="col">Description</th>
                        <th scope="col" class="text-end">Amount</th>
                        <th scope="col" class="text-end">Type</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Loop through transactions -->
                    <tr th:each="tx : ${transactions}">
                        <!-- Format timestamp -->
                        <td th:text="${#temporals.format(tx.timestamp, 'dd-MMM-yyyy HH:mm')}">01-Jan-2025 10:30</td>
                        <td th:text="${tx.description}">Payment for services</td>

                        <!-- Use conditional classes for CREDIT/DEBIT -->
                        <td class="text-end fw-bold"
                            th:classappend="${tx.transactionType.name() == 'CREDIT' ? 'text-success' : 'text-danger'}"
                            th:text="'₹' + ${#numbers.formatDecimal(tx.amount, 1, 'COMMA', 2, 'POINT')}">
                            -₹50.00
                        </td>
                        <td class="text-end">
                            <span class="badge"
                                  th:classappend="${tx.transactionType.name() == 'CREDIT' ? 'bg-success-subtle text-success-emphasis' : 'bg-danger-subtle text-danger-emphasis'}"
                                  th:text="${tx.transactionType.name()}">
                                DEBIT
                            </span>
                        </td>
                    </tr>

                    <!-- No Transactions Message -->
                    <tr th:if="${transactions.isEmpty()}">
                        <td colspan="4" class="text-center text-muted p-4">
                            You have no transactions for this account.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
